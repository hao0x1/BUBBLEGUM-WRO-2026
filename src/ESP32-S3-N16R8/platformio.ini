[platformio]
default_envs = dryRun

[common]
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -Wall
    -Wextra
    -Werror=return-type
lib_deps =
    pololu/VL53L1X@1.3.1
    adafruit/Adafruit BNO055@1.6.3
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4

[env:dryRun]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_filter =
    +<main.cpp>
    +<autonomyController.cpp>
    +<controllerProfiles.cpp>
    +<imuSensors.cpp>
    +<tofSensors.cpp>
    +<visionProtocol.cpp>
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -DBUBBLEGUM_ENABLE_ACTUATION=0
    -DBUBBLEGUM_ENABLE_MPU6050_COMPARISON=1
    -DBUBBLEGUM_AUTONOMY_PROFILE=1
lib_deps = ${common.lib_deps}

[autonomous_common]
build_src_filter =
    +<main.cpp>
    +<autonomyController.cpp>
    +<controllerProfiles.cpp>
    +<imuSensors.cpp>
    +<runBlackBox.cpp>
    +<tofSensors.cpp>
    +<vehicleActuators.cpp>
    +<visionProtocol.cpp>
build_flags =
    ${common.build_flags}
    -DBUBBLEGUM_ENABLE_ACTUATION=1
    -DBUBBLEGUM_ACTUATOR_CALIBRATION_CONFIRMED=1
    -DBUBBLEGUM_ENABLE_MPU6050_COMPARISON=0

[env:autonomousOpen]
extends = env:dryRun
build_src_filter = ${autonomous_common.build_src_filter}
build_flags =
    ${autonomous_common.build_flags}
    -DBUBBLEGUM_AUTONOMY_PROFILE=1

[env:autonomousObstacle]
extends = env:dryRun
build_src_filter = ${autonomous_common.build_src_filter}
build_flags =
    ${autonomous_common.build_flags}
    -DBUBBLEGUM_AUTONOMY_PROFILE=2

; First physical obstacle calibration only. It uses the production R23
; controller but stops permanently after one strictly verified pillar pass,
; with a separate eight-second hard run bound if that proof never arrives.
[env:obstacleSinglePassCalibration]
extends = env:dryRun
build_src_filter = ${autonomous_common.build_src_filter}
build_flags =
    ${autonomous_common.build_flags}
    -DBUBBLEGUM_AUTONOMY_PROFILE=2
    -DBUBBLEGUM_OBSTACLE_SINGLE_PASS_CALIBRATION=1
    -DBUBBLEGUM_CALIBRATION_MAX_RUN_MS=8000

; Backward-compatible alias. It intentionally remains the proven Open profile.
[env:autonomous]
extends = env:autonomousOpen
